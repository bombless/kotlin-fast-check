name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35"

      - name: Prepare Android SDK fixture path
        shell: bash
        run: |
          mkdir -p "d:"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ln -s "$SDK_ROOT" "d:/android-sdk"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run portable tests
        run: npm test -- --exclude tests/e2e/android-space-inspector.test.ts

      - name: Build
        run: npm run build
